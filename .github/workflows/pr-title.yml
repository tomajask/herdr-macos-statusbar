name: PR title

# Squash merges use the PR title as the commit on main, so it must be a Conventional Commit.
# Separate from CI so that editing a title re-runs only this quick check.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  # `pr-title` is a required status check on main; renaming it means updating branch protection.
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: PR title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: scripts/check-pr-title.sh "$TITLE"
